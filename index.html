<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#7b2ff7" />
<title>JJ's Memory Match</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo", system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #ff8ae2 0%, #7b2ff7 45%, #2fb6ff 100%);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    color: #ffffff;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== Animated gaming background (CSS/emoji only) ===== */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }

  .bg-shape {
    position: absolute;
    bottom: -60px;
    font-size: 34px;
    opacity: 0.22;
    animation: drift linear infinite;
    will-change: transform;
  }

  @keyframes drift {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: 0.25; }
    90% { opacity: 0.25; }
    100% {
      transform: translateY(-115vh) rotate(260deg);
      opacity: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-shape { animation-duration: 40s !important; }
  }

  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 10px;
    position: relative;
    width: 100%;
  }

  h1 {
    font-size: clamp(28px, 8vw, 40px);
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
    letter-spacing: 1px;
  }

  /* ---- Sound toggle ---- */
  .sound-toggle {
    position: absolute;
    top: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.25);
    border: none;
    border-radius: 999px;
    width: 46px;
    height: 46px;
    font-size: 24px;
    cursor: pointer;
    color: #fff;
    touch-action: manipulation;
    transition: transform 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sound-toggle:active { transform: scale(0.88); }

  /* ---- Screens ---- */
  .screen {
    display: none;
    width: 100%;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  .screen.active { display: flex; }

  /* ---- Big friendly buttons ---- */
  .big-btn {
    font-family: inherit;
    font-size: 24px;
    font-weight: bold;
    color: #ffffff;
    background: linear-gradient(145deg, #39d353, #1fae3f);
    border: none;
    border-radius: 999px;
    padding: 16px 32px;
    width: 100%;
    max-width: 340px;
    cursor: pointer;
    box-shadow: 0 6px 0 #138a2e;
    touch-action: manipulation;
    margin-top: 12px;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .big-btn:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #138a2e;
  }

  .big-btn.secondary {
    background: linear-gradient(145deg, #ffb13f, #ff8a1f);
    box-shadow: 0 6px 0 #c96a00;
  }
  .big-btn.secondary:active { box-shadow: 0 1px 0 #c96a00; }

  .big-btn.purple {
    background: linear-gradient(145deg, #a86bff, #7b2ff7);
    box-shadow: 0 6px 0 #5a1fb0;
  }
  .big-btn.purple:active { box-shadow: 0 1px 0 #5a1fb0; }

  .big-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
    box-shadow: 0 6px 0 #138a2e;
  }

  /* ---- Start screen ---- */
  .start-card {
    background: rgba(255, 255, 255, 0.22);
    border-radius: 26px;
    padding: 26px 22px;
    width: 100%;
    max-width: 360px;
    text-align: center;
    backdrop-filter: blur(4px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    margin-top: 10px;
  }

  .start-emoji {
    font-size: 54px;
    line-height: 1;
    margin-bottom: 10px;
  }

  .name-label {
    display: block;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 10px;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
  }

  .name-input {
    font-family: inherit;
    font-size: 26px;
    font-weight: bold;
    text-align: center;
    color: #7b2ff7;
    background: #ffffff;
    border: 4px solid #ffd23f;
    border-radius: 18px;
    padding: 14px 12px;
    width: 100%;
    outline: none;
  }

  .name-input::placeholder { color: #c9a7f2; }
  .name-input:focus { border-color: #39d353; }

  /* ---- Scoreboard ---- */
  .scoreboard {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    padding: 8px 18px;
    margin-bottom: 14px;
    font-size: 20px;
    font-weight: bold;
    backdrop-filter: blur(4px);
  }

  .scoreboard .player-name {
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .moves-number {
    background: #fff;
    color: #7b2ff7;
    border-radius: 999px;
    min-width: 42px;
    padding: 2px 10px;
    text-align: center;
  }

  .board {
    width: 100%;
    display: grid;
    /* Columns/rows/gap/aspect-ratio are set per level from JS via inline
       style + CSS custom properties (--cols, --rows, --gap). Defaults
       below match Level 1 (3x4) so the board is sane before a level
       starts. */
    --cols: 3;
    --rows: 4;
    --gap: 12px;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-template-rows: repeat(var(--rows), 1fr);
    gap: var(--gap);
    aspect-ratio: calc(var(--cols) / var(--rows));
    margin-bottom: 14px;
  }

  .card {
    position: relative;
    border: none;
    background: transparent;
    cursor: pointer;
    perspective: 700px;
    padding: 0;
    touch-action: manipulation;
  }

  .card-inner {
    position: absolute;
    inset: 0;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }

  /* Tap squish feedback */
  .card.tapped {
    animation: tapBounce 0.28s ease;
  }

  @keyframes tapBounce {
    0%   { transform: scale(1); }
    45%  { transform: scale(0.9); }
    100% { transform: scale(1); }
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
  }

  .face-back {
    background: linear-gradient(145deg, #ff4e8a, #ff2d6f);
  }

  .face {
    /* --face-font / --back-radius are set per level on .board so denser
       grids get smaller emoji and tighter corners. */
    border-radius: var(--face-radius, 18px);
  }

  .face-back .star {
    font-size: var(--star-font, clamp(32px, 11vw, 54px));
    color: #ffffff;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
  }

  .face-front {
    background: #ffffff;
    transform: rotateY(180deg);
    font-size: var(--face-font, clamp(38px, 13vw, 64px));
  }

  .card.matched .face-front {
    background: #c6ffcf;
    animation: pop 0.55s ease;
    box-shadow: 0 0 0 4px #39d353, 0 5px 0 rgba(0, 0, 0, 0.18);
  }

  @keyframes pop {
    0%   { transform: rotateY(180deg) scale(1); }
    35%  { transform: rotateY(180deg) scale(1.22); }
    60%  { transform: rotateY(180deg) scale(0.92); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  /* ---- Level select ---- */
  .level-select-card {
    background: rgba(255, 255, 255, 0.22);
    border-radius: 26px;
    padding: 20px 16px;
    width: 100%;
    max-width: 380px;
    backdrop-filter: blur(4px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    margin-top: 6px;
  }

  .level-select-card h2 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 14px;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
  }

  .level-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .level-btn {
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    color: #5a1fb0;
    background: rgba(255, 255, 255, 0.92);
    border: none;
    border-radius: 16px;
    padding: 12px 14px;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.15);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .level-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
  }

  .level-btn.locked {
    opacity: 0.55;
    cursor: not-allowed;
    background: rgba(255, 255, 255, 0.55);
  }

  .level-btn.locked:active {
    transform: none;
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.15);
  }

  .level-badge {
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: linear-gradient(145deg, #a86bff, #7b2ff7);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
  }

  .level-btn.locked .level-badge {
    background: #b9a7d6;
  }

  .level-info {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    line-height: 1.2;
    overflow: hidden;
  }

  .level-title {
    font-size: 19px;
    font-weight: bold;
  }

  .level-meta {
    font-size: 14px;
    color: #8a63c9;
    font-weight: bold;
  }

  .level-state {
    flex: 0 0 auto;
    font-size: 24px;
  }

  /* ---- In-game controls bar ---- */
  .game-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    margin-bottom: 10px;
  }

  .mini-btn {
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    color: #ffffff;
    background: rgba(255, 255, 255, 0.25);
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s ease;
  }

  .mini-btn:active { transform: scale(0.94); }

  .mini-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* ---- Leaderboard ---- */
  .leaderboard-card {
    background: rgba(255, 255, 255, 0.22);
    border-radius: 26px;
    padding: 20px 16px;
    width: 100%;
    max-width: 380px;
    backdrop-filter: blur(4px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    margin-top: 6px;
  }

  .leaderboard-card h2 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 6px;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
  }

  .lb-status {
    text-align: center;
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 12px;
    min-height: 18px;
  }

  .lb-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .lb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.9);
    color: #5a1fb0;
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 18px;
    font-weight: bold;
  }

  .lb-rank {
    flex: 0 0 auto;
    font-size: 22px;
    min-width: 30px;
    text-align: center;
  }

  .lb-name {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .lb-moves {
    flex: 0 0 auto;
    background: #7b2ff7;
    color: #fff;
    border-radius: 999px;
    padding: 2px 12px;
    font-size: 16px;
  }

  .lb-date {
    flex: 0 0 auto;
    font-size: 13px;
    color: #8a63c9;
    font-weight: normal;
  }

  .lb-empty {
    text-align: center;
    font-size: 18px;
    padding: 20px 10px;
    color: #ffffff;
  }

  .clear-link {
    display: block;
    margin: 14px auto 0;
    background: none;
    border: none;
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    text-decoration: underline;
    cursor: pointer;
    opacity: 0.85;
  }

  /* ---- Overlay (win + confirm) ---- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(40, 0, 70, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }

  .overlay.show {
    display: flex;
    animation: fade 0.3s ease;
  }

  @keyframes fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .banner {
    background: linear-gradient(160deg, #fff6a9, #ffd23f);
    color: #7b2ff7;
    border-radius: 26px;
    padding: 28px 24px;
    text-align: center;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    animation: bounceIn 0.5s ease;
    position: relative;
    z-index: 12;
  }

  @keyframes bounceIn {
    0%   { transform: scale(0.6); opacity: 0; }
    60%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }

  .banner .emoji {
    font-size: 58px;
    line-height: 1;
  }

  .banner h2 {
    font-size: 30px;
    margin: 10px 0 6px;
  }

  .banner p {
    font-size: 20px;
    margin-bottom: 20px;
    color: #5a1fb0;
  }

  .banner p b { font-size: 24px; }

  .banner .btn-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .banner .big-btn { margin-top: 0; }

  /* ---- Confetti / star burst ---- */
  .confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 11;
    overflow: hidden;
  }

  .confetti {
    position: absolute;
    top: -40px;
    font-size: 26px;
    animation: confettiFall linear forwards;
    will-change: transform;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(-40px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0.9; }
  }
</style>
</head>
<body>
  <!-- Animated gaming background -->
  <div class="bg-layer" id="bgLayer" aria-hidden="true"></div>

  <div class="app">
    <header>
      <h1>JJ's Memory Match</h1>
      <button class="sound-toggle" id="soundToggle" type="button" aria-label="Toggle sound">🔊</button>
    </header>

    <!-- ===== Start Screen ===== -->
    <div class="screen active" id="startScreen">
      <div class="start-card">
        <div class="start-emoji">🎮 🕹️ 👾</div>
        <label class="name-label" for="nameInput">What's your name?</label>
        <input
          class="name-input"
          id="nameInput"
          type="text"
          maxlength="14"
          autocomplete="off"
          autocapitalize="words"
          placeholder="Type your name"
        />
      </div>
      <button class="big-btn" id="startBtn" disabled>Play!</button>
      <button class="big-btn purple" id="toLeaderboardBtn">🏆 Leaderboard</button>
    </div>

    <!-- ===== Level Select Screen ===== -->
    <div class="screen" id="levelSelectScreen">
      <div class="level-select-card">
        <h2>🗺️ Pick a Level</h2>
        <ol class="level-list" id="levelList"></ol>
      </div>
      <button class="big-btn secondary" id="levelBackBtn">Back</button>
    </div>

    <!-- ===== Game Screen ===== -->
    <div class="screen" id="gameScreen">
      <div class="scoreboard">
        <span class="player-name" id="scorePlayer">Player</span>
        <span>•</span>
        <span>Moves:</span>
        <span class="moves-number" id="moves">0</span>
      </div>
      <div class="game-controls">
        <button class="mini-btn" id="gameBackBtn" type="button">⬅ Levels</button>
        <!-- Peek/hint button is added in FEAT-003 (coins). -->
      </div>
      <div class="board" id="board" aria-label="Memory game board"></div>
    </div>

    <!-- ===== Leaderboard Screen ===== -->
    <div class="screen" id="leaderboardScreen">
      <div class="leaderboard-card">
        <h2>🏆 Leaderboard</h2>
        <div class="lb-status" id="lbStatus"></div>
        <ol class="lb-list" id="lbList"></ol>
      </div>
      <button class="clear-link" id="clearBoardBtn">Clear board</button>
      <button class="big-btn secondary" id="lbBackBtn">Back</button>
    </div>
  </div>

  <!-- ===== Win Overlay ===== -->
  <div class="overlay" id="overlay">
    <div class="banner">
      <div class="emoji">🎮🏆🎮</div>
      <h2>You Win!</h2>
      <p>Great job, <b id="winName">Player</b>!<br />You did it in <b id="finalMoves">0</b> moves!</p>
      <div class="btn-row">
        <button class="big-btn" id="winNextBtn">Next Level ➡</button>
        <button class="big-btn secondary" id="playAgain">Play Again</button>
        <button class="big-btn purple" id="winLevelsBtn">🗺️ Level Select</button>
        <button class="big-btn purple" id="winLeaderboardBtn">🏆 Leaderboard</button>
      </div>
    </div>
  </div>

  <!-- ===== Clear Confirm Overlay ===== -->
  <div class="overlay" id="confirmOverlay">
    <div class="banner">
      <div class="emoji">🧹</div>
      <h2>Clear the board?</h2>
      <p>This erases the scores saved on this device. You can't undo it.</p>
      <div class="btn-row">
        <button class="big-btn" id="confirmClearYes" style="background:linear-gradient(145deg,#ff5e6c,#e23744);box-shadow:0 6px 0 #a81824;">Yes, clear it</button>
        <button class="big-btn purple" id="confirmClearNo">Keep scores</button>
      </div>
    </div>
  </div>

  <!-- Confetti layer -->
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

<script>
  /* ============================================================
     FAMILY SCORES SERVER
     ------------------------------------------------------------
     Optional online leaderboard shared across the family's
     devices. All calls here are best-effort with a short timeout:
     if anything fails or there is no connection, the game falls
     back to the local (localStorage) board and keeps working
     perfectly offline. These are the ONLY network calls the game
     makes.
     ============================================================ */
  var SCORES_SERVER = {
    base: "https://games.cardcauldrontcg.com/scores",
    key: "family-games-2026",
    game: "jj-memory-match",
    timeoutMs: 4000
  };

  // fetch() with a short timeout so slow/no network never blocks play.
  function fetchWithTimeout(url, options, timeoutMs) {
    options = options || {};
    if (typeof AbortController === "undefined" || !window.fetch) {
      return Promise.reject(new Error("fetch-unavailable"));
    }
    var controller = new AbortController();
    var timer = setTimeout(function () {
      controller.abort();
    }, timeoutMs);
    options.signal = controller.signal;
    return fetch(url, options).then(
      function (res) { clearTimeout(timer); return res; },
      function (err) { clearTimeout(timer); throw err; }
    );
  }

  // Submit a finished score to the server (fire-and-forget, background).
  // Never throws to the caller; failures are swallowed.
  function submitScoreToServer(name, score) {
    try {
      return fetchWithTimeout(
        SCORES_SERVER.base,
        {
          method: "POST",
          headers: {
            "X-Family-Key": SCORES_SERVER.key,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            game: SCORES_SERVER.game,
            name: name,
            score: score
          })
        },
        SCORES_SERVER.timeoutMs
      )
        .then(function () { /* ignore response */ })
        .catch(function () { /* offline / error: local board already saved */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  // Read the shared board from the server.
  // Resolves to an array of {name, score, date} (already sorted fewest
  // moves first) or rejects so callers can fall back to the local board.
  function fetchServerScores() {
    var url = SCORES_SERVER.base +
      "?game=" + encodeURIComponent(SCORES_SERVER.game);
    return fetchWithTimeout(
      url,
      {
        method: "GET",
        headers: { "X-Family-Key": SCORES_SERVER.key }
      },
      SCORES_SERVER.timeoutMs
    ).then(function (res) {
      if (!res.ok) throw new Error("bad-status");
      return res.json();
    }).then(function (data) {
      if (!data || !Array.isArray(data.scores)) throw new Error("bad-body");
      return data.scores.filter(function (s) {
        return s && typeof s.name === "string" && typeof s.score === "number";
      });
    });
  }
  /* ===================== END FAMILY SCORES SERVER ===================== */

  // Gaming-themed emoji pool: controllers, consoles, arcade & retro gaming symbols
  var EMOJI_POOL = [
    "🎮", "🕹️", "👾", "🎲", "🏆", "📺",
    "💾", "💿", "🖥️", "⌨️", "🖱️", "🎯",
    "🃏", "♟️", "🧩", "⭐", "💎", "🔋",
    "🛸", "🚀", "⚡", "🔥", "🎰", "🏅"
  ];

  /* ===================== LEVELS =====================
     Five levels of growing difficulty. Each level drives the deck size
     (pairs) and the board grid (cols/rows) plus density tuning (gap and
     emoji font size) so every grid fits the phone-first 480px container
     with tappable cards.
       cols * rows === pairs * 2 (every card has a slot).
       6 -> 12 (3x4), 8 -> 16 (4x4), 10 -> 20 (4x5),
       12 -> 24 (4x6), 15 -> 30 (5x6).
     ===================================================================== */
  var LEVELS = [
    { level: 1, pairs: 6,  cols: 3, rows: 4, gap: 12, faceFont: 44, starFont: 40 },
    { level: 2, pairs: 8,  cols: 4, rows: 4, gap: 10, faceFont: 34, starFont: 30 },
    { level: 3, pairs: 10, cols: 4, rows: 5, gap: 9,  faceFont: 30, starFont: 26 },
    { level: 4, pairs: 12, cols: 4, rows: 6, gap: 8,  faceFont: 28, starFont: 24 },
    { level: 5, pairs: 15, cols: 5, rows: 6, gap: 6,  faceFont: 22, starFont: 20 }
  ];

  // Look up a level config by its level number (returns null if missing).
  function getLevelConfig(levelNumber) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (LEVELS[i].level === levelNumber) return LEVELS[i];
    }
    return null;
  }

  // The active level config while a game is in progress. Set by startLevel().
  // Defaults to level 1 so buildDeck()/win-check always have a pair count.
  var currentLevel = LEVELS[0];

  var STORAGE_KEY = "jjMemoryMatch.leaderboard";
  var NAME_KEY = "jjMemoryMatch.playerName";
  var SOUND_KEY = "jjMemoryMatch.sound";
  var MAX_SCORES = 10;

  /* ===================== PER-PLAYER PROGRESS STORAGE =====================
     Progress (coins, unlocked levels, owned/equipped rewards, per-level
     best moves) is saved per player name in localStorage under a key that
     is namespaced by the player's (trimmed, lower-cased) name. Later
     features (levels, coins, hints, shop/rewards) read and write
     currentProgress via loadProgress()/saveProgress().

     The defaults make the EXISTING game items the free owned+equipped
     defaults so nothing regresses: the gaming emoji face theme
     (EMOJI_POOL), the pink-star card back (.face.face-back), and the
     classic confetti set (launchConfetti pieces). Level 1 is always
     unlocked.
     ===================================================================== */
  var PROGRESS_KEY_PREFIX = "jjMemoryMatch.progress.";

  // Build a fresh defaults object (returns a new object every call so
  // callers can safely mutate it without touching shared state).
  function defaultProgress() {
    return {
      coins: 0,
      unlockedLevels: [1],            // level 1 is always unlocked
      bestMoves: {},                  // map: levelNumber -> fewest moves
      ownedRewards: {
        faceThemes: ["gaming"],       // existing EMOJI_POOL theme
        cardBacks: ["classic"],       // existing pink-star back
        confetti: ["classic"]         // existing launchConfetti set
      },
      equipped: {
        faceTheme: "gaming",
        cardBack: "classic",
        confetti: "classic"
      }
    };
  }

  // Namespaced localStorage key for a given player name.
  function progressKey(name) {
    var clean = String(name == null ? "" : name).trim().toLowerCase();
    return PROGRESS_KEY_PREFIX + encodeURIComponent(clean);
  }

  // Defensive array-of-strings cleaner that also guarantees a required
  // default item is present (used for owned reward lists).
  function mergeOwnedList(stored, required) {
    var out = [];
    var seen = {};
    function add(v) {
      if (typeof v === "string" && v && !seen[v]) { seen[v] = true; out.push(v); }
    }
    add(required);
    if (Array.isArray(stored)) {
      for (var i = 0; i < stored.length; i++) add(stored[i]);
    }
    return out;
  }

  // Load progress for a player, merging stored data over the defaults so
  // new players get defaults and corrupt / partial data never throws.
  function loadProgress(name) {
    var base = defaultProgress();
    try {
      var raw = localStorage.getItem(progressKey(name));
      if (!raw) return base;
      var data = JSON.parse(raw);
      if (!data || typeof data !== "object") return base;

      // coins
      if (typeof data.coins === "number" && isFinite(data.coins) && data.coins >= 0) {
        base.coins = Math.floor(data.coins);
      }

      // unlockedLevels (always include level 1)
      if (Array.isArray(data.unlockedLevels)) {
        var levels = [1];
        for (var i = 0; i < data.unlockedLevels.length; i++) {
          var lv = data.unlockedLevels[i];
          if (typeof lv === "number" && lv >= 1 && levels.indexOf(lv) === -1) {
            levels.push(lv);
          }
        }
        levels.sort(function (a, b) { return a - b; });
        base.unlockedLevels = levels;
      }

      // bestMoves (map of level -> positive number)
      if (data.bestMoves && typeof data.bestMoves === "object") {
        var bm = {};
        for (var k in data.bestMoves) {
          if (Object.prototype.hasOwnProperty.call(data.bestMoves, k)) {
            var v = data.bestMoves[k];
            if (typeof v === "number" && isFinite(v) && v > 0) bm[k] = Math.floor(v);
          }
        }
        base.bestMoves = bm;
      }

      // ownedRewards (each list keeps its required default item)
      if (data.ownedRewards && typeof data.ownedRewards === "object") {
        base.ownedRewards.faceThemes =
          mergeOwnedList(data.ownedRewards.faceThemes, "gaming");
        base.ownedRewards.cardBacks =
          mergeOwnedList(data.ownedRewards.cardBacks, "classic");
        base.ownedRewards.confetti =
          mergeOwnedList(data.ownedRewards.confetti, "classic");
      }

      // equipped (only accept values the player actually owns)
      if (data.equipped && typeof data.equipped === "object") {
        if (base.ownedRewards.faceThemes.indexOf(data.equipped.faceTheme) !== -1) {
          base.equipped.faceTheme = data.equipped.faceTheme;
        }
        if (base.ownedRewards.cardBacks.indexOf(data.equipped.cardBack) !== -1) {
          base.equipped.cardBack = data.equipped.cardBack;
        }
        if (base.ownedRewards.confetti.indexOf(data.equipped.confetti) !== -1) {
          base.equipped.confetti = data.equipped.confetti;
        }
      }
    } catch (e) {
      return defaultProgress();
    }
    return base;
  }

  // Persist a player's progress. Never throws (storage may be full/blocked).
  function saveProgress(name, progress) {
    try {
      localStorage.setItem(progressKey(name), JSON.stringify(progress));
    } catch (e) {}
  }
  /* ===================== END PER-PLAYER PROGRESS STORAGE ===================== */

  // ---- Elements ----
  var startScreen = document.getElementById("startScreen");
  var levelSelectScreen = document.getElementById("levelSelectScreen");
  var gameScreen = document.getElementById("gameScreen");
  var leaderboardScreen = document.getElementById("leaderboardScreen");

  var nameInput = document.getElementById("nameInput");
  var startBtn = document.getElementById("startBtn");
  var toLeaderboardBtn = document.getElementById("toLeaderboardBtn");

  var levelList = document.getElementById("levelList");
  var levelBackBtn = document.getElementById("levelBackBtn");
  var gameBackBtn = document.getElementById("gameBackBtn");

  var board = document.getElementById("board");
  var movesEl = document.getElementById("moves");
  var scorePlayerEl = document.getElementById("scorePlayer");

  var overlay = document.getElementById("overlay");
  var finalMovesEl = document.getElementById("finalMoves");
  var winNameEl = document.getElementById("winName");
  var playAgainBtn = document.getElementById("playAgain");
  var winLeaderboardBtn = document.getElementById("winLeaderboardBtn");
  var winNextBtn = document.getElementById("winNextBtn");
  var winLevelsBtn = document.getElementById("winLevelsBtn");

  var lbList = document.getElementById("lbList");
  var lbStatus = document.getElementById("lbStatus");
  var lbBackBtn = document.getElementById("lbBackBtn");
  var clearBoardBtn = document.getElementById("clearBoardBtn");

  var confirmOverlay = document.getElementById("confirmOverlay");
  var confirmClearYes = document.getElementById("confirmClearYes");
  var confirmClearNo = document.getElementById("confirmClearNo");

  var soundToggle = document.getElementById("soundToggle");
  var bgLayer = document.getElementById("bgLayer");
  var confettiLayer = document.getElementById("confettiLayer");

  // ---- Game state ----
  var moves = 0;
  var matchedCount = 0;
  var firstCard = null;
  var secondCard = null;
  var lockBoard = false;
  var currentPlayer = "";
  var currentProgress = null; // per-player progress, loaded in beginFromStart()
  var lbRequestId = 0;

  // ---- Screen switching ----
  function showScreen(screen) {
    startScreen.classList.remove("active");
    levelSelectScreen.classList.remove("active");
    gameScreen.classList.remove("active");
    leaderboardScreen.classList.remove("active");
    // (shop/rewards screens are added in FEAT-004 and must be listed here too)
    screen.classList.add("active");
  }

  /* ===================== SOUND (WebAudio only) ===================== */
  var soundOn = true;
  var audioCtx = null;

  function loadSoundPref() {
    try {
      var v = localStorage.getItem(SOUND_KEY);
      return v === null ? true : v === "on";
    } catch (e) { return true; }
  }

  function saveSoundPref() {
    try { localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off"); } catch (e) {}
  }

  function ensureAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }

  // Play a short tone. type: 'sine'/'square'/'triangle'
  function tone(freq, startAt, duration, type, gainPeak) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, startAt);
    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.exponentialRampToValueAtTime(gainPeak || 0.2, startAt + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startAt);
    osc.stop(startAt + duration + 0.02);
  }

  function playPop() {
    if (!soundOn) return;
    ensureAudio();
    if (!audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume();
    var t = audioCtx.currentTime;
    tone(520, t, 0.1, "square", 0.18);
    tone(780, t + 0.04, 0.1, "square", 0.14);
  }

  function playMatch() {
    if (!soundOn) return;
    ensureAudio();
    if (!audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume();
    var t = audioCtx.currentTime;
    tone(660, t, 0.14, "triangle", 0.2);
    tone(880, t + 0.11, 0.18, "triangle", 0.2);
  }

  function playCheer() {
    if (!soundOn) return;
    ensureAudio();
    if (!audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume();
    var t = audioCtx.currentTime;
    var notes = [523, 659, 784, 1047]; // C E G C — happy arpeggio
    for (var i = 0; i < notes.length; i++) {
      tone(notes[i], t + i * 0.12, 0.22, "triangle", 0.22);
    }
  }

  function updateSoundToggle() {
    soundToggle.textContent = soundOn ? "🔊" : "🔇";
    soundToggle.setAttribute("aria-label", soundOn ? "Sound on" : "Sound off");
  }

  soundToggle.addEventListener("click", function () {
    soundOn = !soundOn;
    saveSoundPref();
    updateSoundToggle();
    if (soundOn) { ensureAudio(); playPop(); }
  });
  /* ===================== END SOUND ===================== */

  // ---- localStorage leaderboard (offline fallback) ----
  function loadScores() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var data = JSON.parse(raw);
      if (!Array.isArray(data)) return [];
      return data.filter(function (s) {
        return s && typeof s.name === "string" && typeof s.moves === "number";
      });
    } catch (e) {
      return [];
    }
  }

  function saveScores(scores) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
    } catch (e) {}
  }

  function loadName() {
    try { return localStorage.getItem(NAME_KEY) || ""; }
    catch (e) { return ""; }
  }

  function saveName(name) {
    try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
  }

  // Record a finished game locally (always), sorted fewest moves first, cap 10.
  function recordScore(name, moveCount) {
    var scores = loadScores();
    scores.push({
      name: name,
      moves: moveCount,
      date: new Date().toISOString()
    });
    scores.sort(function (a, b) { return a.moves - b.moves; });
    scores = scores.slice(0, MAX_SCORES);
    saveScores(scores);
  }

  function formatDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var month = d.getMonth() + 1;
    var day = d.getDate();
    var year = String(d.getFullYear()).slice(2);
    return month + "/" + day + "/" + year;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // Normalize to a common shape {name, moves, date} for rendering.
  function normalizeLocal(scores) {
    return scores.map(function (s) {
      return { name: s.name, moves: s.moves, date: s.date };
    });
  }
  function normalizeServer(scores) {
    return scores.map(function (s) {
      return { name: s.name, moves: s.score, date: s.date };
    });
  }

  function renderRows(rows) {
    lbList.innerHTML = "";
    if (!rows || rows.length === 0) {
      var empty = document.createElement("li");
      empty.className = "lb-empty";
      empty.textContent = "No scores yet — play a game!";
      lbList.appendChild(empty);
      return;
    }
    var medals = ["🥇", "🥈", "🥉"];
    var limit = Math.min(rows.length, MAX_SCORES);
    for (var i = 0; i < limit; i++) {
      var s = rows[i];
      var li = document.createElement("li");
      li.className = "lb-row";
      var rank = i < 3 ? medals[i] : (i + 1);
      li.innerHTML =
        '<span class="lb-rank">' + rank + '</span>' +
        '<span class="lb-name">' + escapeHtml(s.name) + '</span>' +
        '<span class="lb-date">' + formatDate(s.date) + '</span>' +
        '<span class="lb-moves">' + s.moves + '</span>';
      lbList.appendChild(li);
    }
  }

  // Show local board immediately, then try the server and swap in if it works.
  function openLeaderboard() {
    var myId = ++lbRequestId;
    renderRows(normalizeLocal(loadScores()));
    lbStatus.textContent = "Checking family scores…";

    fetchServerScores().then(function (serverScores) {
      if (myId !== lbRequestId) return; // a newer open happened
      renderRows(normalizeServer(serverScores));
      lbStatus.textContent = "🌐 Family scores (online)";
    }).catch(function () {
      if (myId !== lbRequestId) return;
      lbStatus.textContent = "📱 Saved on this device (offline)";
    });
  }

  // ---- Deck building ----
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function buildDeck() {
    var pool = shuffle(EMOJI_POOL.slice());
    var chosen = pool.slice(0, currentLevel.pairs);
    var deck = chosen.concat(chosen);
    return shuffle(deck);
  }

  function createCard(emoji) {
    var card = document.createElement("button");
    card.className = "card";
    card.type = "button";
    card.setAttribute("aria-label", "Card");
    card.dataset.emoji = emoji;

    card.innerHTML =
      '<div class="card-inner">' +
        '<div class="face face-back"><span class="star">★</span></div>' +
        '<div class="face face-front">' + emoji + '</div>' +
      '</div>';

    card.addEventListener("click", function () {
      onCardClick(card);
    });
    return card;
  }

  function onCardClick(card) {
    if (lockBoard) return;
    if (card === firstCard) return;
    if (card.classList.contains("matched")) return;
    if (card.classList.contains("flipped")) return;

    // Juicy tap: squish animation + pop sound
    card.classList.remove("tapped");
    void card.offsetWidth; // restart animation
    card.classList.add("tapped");
    playPop();

    card.classList.add("flipped");

    if (!firstCard) {
      firstCard = card;
      return;
    }

    secondCard = card;
    moves++;
    movesEl.textContent = moves;
    checkMatch();
  }

  function checkMatch() {
    var isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;

    if (isMatch) {
      firstCard.classList.add("matched");
      secondCard.classList.add("matched");
      matchedCount++;
      playMatch();
      resetTurn();
      if (matchedCount === currentLevel.pairs) {
        setTimeout(showWin, 550);
      }
    } else {
      lockBoard = true;
      setTimeout(function () {
        firstCard.classList.remove("flipped");
        secondCard.classList.remove("flipped");
        resetTurn();
      }, 900);
    }
  }

  function resetTurn() {
    firstCard = null;
    secondCard = null;
    lockBoard = false;
  }

  function showWin() {
    var levelNumber = currentLevel.level;

    // Always save locally first (offline-safe), then submit in background.
    // Score = moves for the finished level — kept EXACTLY as before.
    recordScore(currentPlayer, moves);
    submitScoreToServer(currentPlayer, moves);

    // ----- Per-player progress: best moves + unlock next level -----
    if (currentProgress) {
      var prevBest = currentProgress.bestMoves[levelNumber];
      if (typeof prevBest !== "number" || moves < prevBest) {
        currentProgress.bestMoves[levelNumber] = moves;
      }

      var nextConfig = getLevelConfig(levelNumber + 1);
      if (nextConfig &&
          currentProgress.unlockedLevels.indexOf(nextConfig.level) === -1) {
        currentProgress.unlockedLevels.push(nextConfig.level);
        currentProgress.unlockedLevels.sort(function (a, b) { return a - b; });
      }

      /* ===== COIN INTEGRATION POINT (FEAT-003) =====
         Coins are awarded here, AFTER the score is recorded/submitted and
         BEFORE saveProgress() persists the run. FEAT-003 should add the
         coin math (per-match coins + a fewer-moves bonus) and update
         currentProgress.coins at this point, e.g.:
             awardCoinsForLevel(currentLevel, moves);
         Do not add real-money purchases — coins are earned by playing. */

      saveProgress(currentPlayer, currentProgress);
    }

    // ----- Win banner -----
    finalMovesEl.textContent = moves;
    winNameEl.textContent = currentPlayer;

    // "Next Level" only when there is a (now unlocked) next level.
    var next = getLevelConfig(levelNumber + 1);
    var hasNext = !!(next && currentProgress &&
      currentProgress.unlockedLevels.indexOf(next.level) !== -1);
    winNextBtn.style.display = hasNext ? "" : "none";

    overlay.classList.add("show");
    playCheer();
    launchConfetti();
  }

  // Apply the active level's grid sizing (cols/rows/gap/aspect-ratio) and
  // emoji font density to the board via CSS custom properties.
  function applyLevelLayout(level) {
    board.style.setProperty("--cols", level.cols);
    board.style.setProperty("--rows", level.rows);
    board.style.setProperty("--gap", level.gap + "px");
    board.style.setProperty("--face-font", level.faceFont + "px");
    board.style.setProperty("--star-font", level.starFont + "px");
    board.style.setProperty("--face-radius",
      (level.pairs >= 12 ? 12 : 18) + "px");
  }

  // Start a specific level. Sets currentLevel then runs the shared game
  // setup. Pass a LEVELS config object.
  function startLevel(level) {
    currentLevel = level;
    startGame();
  }

  function startGame() {
    overlay.classList.remove("show");
    showScreen(gameScreen);
    board.innerHTML = "";
    moves = 0;
    matchedCount = 0;
    firstCard = null;
    secondCard = null;
    lockBoard = false;
    movesEl.textContent = "0";
    scorePlayerEl.textContent = currentPlayer;

    applyLevelLayout(currentLevel);

    var deck = buildDeck();
    for (var i = 0; i < deck.length; i++) {
      board.appendChild(createCard(deck[i]));
    }
  }

  // ---- Level select screen ----
  function isLevelUnlocked(levelNumber) {
    return !!(currentProgress &&
      currentProgress.unlockedLevels.indexOf(levelNumber) !== -1);
  }

  // Build the list of level buttons from LEVELS + currentProgress.
  function renderLevelSelect() {
    levelList.innerHTML = "";
    for (var i = 0; i < LEVELS.length; i++) {
      (function (level) {
        var unlocked = isLevelUnlocked(level.level);
        var best = currentProgress ? currentProgress.bestMoves[level.level] : null;

        var li = document.createElement("li");
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "level-btn" + (unlocked ? "" : " locked");
        btn.disabled = !unlocked;

        var meta = level.pairs + " pairs";
        if (unlocked && typeof best === "number") {
          meta += " • Best: " + best + " moves";
        } else if (unlocked) {
          meta += " • Not played yet";
        } else {
          meta += " • Locked";
        }

        btn.innerHTML =
          '<span class="level-badge">' + level.level + '</span>' +
          '<span class="level-info">' +
            '<span class="level-title">Level ' + level.level + '</span>' +
            '<span class="level-meta">' + meta + '</span>' +
          '</span>' +
          '<span class="level-state">' + (unlocked ? "▶️" : "🔒") + '</span>';

        if (unlocked) {
          btn.addEventListener("click", function () {
            ensureAudio();
            startLevel(level);
          });
        }

        li.appendChild(btn);
        levelList.appendChild(li);
      })(LEVELS[i]);
    }
  }

  // Show the level select screen (refreshing its contents first).
  function openLevelSelect() {
    renderLevelSelect();
    showScreen(levelSelectScreen);
  }

  // ---- Confetti / star burst ----
  function launchConfetti() {
    var pieces = ["⭐", "🎉", "🏆", "🎮", "💎", "✨", "🕹️"];
    var count = 32;
    for (var i = 0; i < count; i++) {
      (function (i) {
        var el = document.createElement("span");
        el.className = "confetti";
        el.textContent = pieces[Math.floor(Math.random() * pieces.length)];
        el.style.left = Math.random() * 100 + "vw";
        el.style.fontSize = (18 + Math.random() * 20) + "px";
        var dur = 1.8 + Math.random() * 1.6;
        el.style.animationDuration = dur + "s";
        el.style.animationDelay = (Math.random() * 0.5) + "s";
        confettiLayer.appendChild(el);
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, (dur + 0.6) * 1000);
      })(i);
    }
  }

  // ---- Animated background ----
  function buildBackground() {
    var shapes = ["🎮", "🕹️", "👾", "⭐", "💎", "🎲", "🚀", "✨", "🏆", "⚡"];
    var total = 16;
    for (var i = 0; i < total; i++) {
      var el = document.createElement("span");
      el.className = "bg-shape";
      el.textContent = shapes[i % shapes.length];
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = (22 + Math.random() * 26) + "px";
      var dur = 14 + Math.random() * 16;
      el.style.animationDuration = dur + "s";
      el.style.animationDelay = "-" + (Math.random() * dur) + "s";
      bgLayer.appendChild(el);
    }
  }

  // ---- Name field wiring ----
  function updateStartEnabled() {
    startBtn.disabled = nameInput.value.trim().length === 0;
  }

  nameInput.addEventListener("input", updateStartEnabled);
  nameInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !startBtn.disabled) {
      beginFromStart();
    }
  });

  function beginFromStart() {
    var name = nameInput.value.trim();
    if (!name) return;
    currentPlayer = name;
    saveName(name);
    currentProgress = loadProgress(name); // per-player progress layer (FEAT-001)
    ensureAudio(); // unlock audio on a user gesture
    openLevelSelect(); // Play! now goes to Level Select instead of straight into a game
  }

  // ---- Button wiring ----
  startBtn.addEventListener("click", beginFromStart);

  toLeaderboardBtn.addEventListener("click", function () {
    showScreen(leaderboardScreen);
    openLeaderboard();
  });

  winLeaderboardBtn.addEventListener("click", function () {
    overlay.classList.remove("show");
    showScreen(leaderboardScreen);
    openLeaderboard();
  });

  // Win banner: go to the next (now unlocked) level.
  winNextBtn.addEventListener("click", function () {
    var next = getLevelConfig(currentLevel.level + 1);
    overlay.classList.remove("show");
    if (next && isLevelUnlocked(next.level)) {
      startLevel(next);
    } else {
      openLevelSelect();
    }
  });

  // Win banner: back to level select.
  winLevelsBtn.addEventListener("click", function () {
    overlay.classList.remove("show");
    openLevelSelect();
  });

  // Level select: Back returns to the start screen.
  levelBackBtn.addEventListener("click", function () {
    showScreen(startScreen);
  });

  // In-game: Back returns to the level select screen.
  gameBackBtn.addEventListener("click", function () {
    openLevelSelect();
  });

  lbBackBtn.addEventListener("click", function () {
    showScreen(startScreen);
  });

  // Play Again replays the current level.
  playAgainBtn.addEventListener("click", function () {
    startGame();
  });

  // ---- Clear board (with confirm step) ----
  clearBoardBtn.addEventListener("click", function () {
    confirmOverlay.classList.add("show");
  });

  confirmClearNo.addEventListener("click", function () {
    confirmOverlay.classList.remove("show");
  });

  confirmClearYes.addEventListener("click", function () {
    saveScores([]); // clears the local/device board
    confirmOverlay.classList.remove("show");
    openLeaderboard();
  });

  // ---- Init ----
  (function init() {
    buildBackground();

    soundOn = loadSoundPref();
    updateSoundToggle();

    var saved = loadName();
    if (saved) nameInput.value = saved;
    updateStartEnabled();
  })();
</script>
</body>
</html>

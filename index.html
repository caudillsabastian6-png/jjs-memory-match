<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#7b2ff7" />
<title>JJ's Memory Match</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo", system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #ff8ae2 0%, #7b2ff7 45%, #2fb6ff 100%);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    color: #ffffff;
    overflow-x: hidden;
  }

  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  header {
    text-align: center;
    margin-bottom: 10px;
  }

  h1 {
    font-size: clamp(28px, 8vw, 40px);
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
    letter-spacing: 1px;
  }

  .scoreboard {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    padding: 8px 18px;
    margin-bottom: 14px;
    font-size: 20px;
    font-weight: bold;
    backdrop-filter: blur(4px);
  }

  .moves-number {
    background: #fff;
    color: #7b2ff7;
    border-radius: 999px;
    min-width: 42px;
    padding: 2px 10px;
    text-align: center;
  }

  .board {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    aspect-ratio: 3 / 4;
    margin-bottom: 14px;
  }

  .card {
    position: relative;
    border: none;
    background: transparent;
    cursor: pointer;
    perspective: 700px;
    padding: 0;
    touch-action: manipulation;
  }

  .card-inner {
    position: absolute;
    inset: 0;
    transition: transform 0.35s ease;
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
  }

  .face-back {
    background: linear-gradient(145deg, #ff4e8a, #ff2d6f);
  }

  .face-back .star {
    font-size: clamp(32px, 11vw, 54px);
    color: #ffffff;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
  }

  .face-front {
    background: #ffffff;
    transform: rotateY(180deg);
    font-size: clamp(38px, 13vw, 64px);
  }

  .card.matched .face-front {
    background: #c6ffcf;
    animation: pop 0.45s ease;
    box-shadow: 0 0 0 4px #39d353, 0 5px 0 rgba(0, 0, 0, 0.18);
  }

  @keyframes pop {
    0%   { transform: rotateY(180deg) scale(1); }
    40%  { transform: rotateY(180deg) scale(1.18); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(40, 0, 70, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }

  .overlay.show {
    display: flex;
    animation: fade 0.3s ease;
  }

  @keyframes fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .banner {
    background: linear-gradient(160deg, #fff6a9, #ffd23f);
    color: #7b2ff7;
    border-radius: 26px;
    padding: 28px 24px;
    text-align: center;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    animation: bounceIn 0.5s ease;
  }

  @keyframes bounceIn {
    0%   { transform: scale(0.6); opacity: 0; }
    60%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }

  .banner .emoji {
    font-size: 58px;
    line-height: 1;
  }

  .banner h2 {
    font-size: 30px;
    margin: 10px 0 6px;
  }

  .banner p {
    font-size: 20px;
    margin-bottom: 20px;
    color: #5a1fb0;
  }

  .banner p b {
    font-size: 24px;
  }

  .play-again {
    font-family: inherit;
    font-size: 24px;
    font-weight: bold;
    color: #ffffff;
    background: linear-gradient(145deg, #39d353, #1fae3f);
    border: none;
    border-radius: 999px;
    padding: 16px 32px;
    width: 100%;
    cursor: pointer;
    box-shadow: 0 5px 0 #138a2e;
    touch-action: manipulation;
  }

  .play-again:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #138a2e;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>JJ's Memory Match</h1>
    </header>

    <div class="scoreboard">
      <span>Moves:</span>
      <span class="moves-number" id="moves">0</span>
    </div>

    <div class="board" id="board" aria-label="Memory game board"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="banner">
      <div class="emoji">🎉🏆🎉</div>
      <h2>You Win!</h2>
      <p>You did it in <b id="finalMoves">0</b> moves!</p>
      <button class="play-again" id="playAgain">Play Again</button>
    </div>
  </div>

<script>
  // Kid-friendly emoji pool: animals, space, food
  var EMOJI_POOL = [
    "🐶", "🐱", "🦁", "🐸", "🐵", "🐼", "🦊", "🐷", "🐙", "🦄", "🐝", "🐢",
    "🚀", "🌟", "🌈", "🪐", "☀️", "🌙",
    "🍎", "🍌", "🍓", "🍕", "🍩", "🍪", "🍉", "🧁"
  ];

  var PAIRS = 6;

  var board = document.getElementById("board");
  var movesEl = document.getElementById("moves");
  var overlay = document.getElementById("overlay");
  var finalMovesEl = document.getElementById("finalMoves");
  var playAgainBtn = document.getElementById("playAgain");

  var moves = 0;
  var matchedCount = 0;
  var firstCard = null;
  var secondCard = null;
  var lockBoard = false;

  // Shuffle an array in place (Fisher-Yates)
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  // Pick PAIRS unique emoji at random, duplicate each, then shuffle
  function buildDeck() {
    var pool = shuffle(EMOJI_POOL.slice());
    var chosen = pool.slice(0, PAIRS);
    var deck = chosen.concat(chosen);
    return shuffle(deck);
  }

  function createCard(emoji) {
    var card = document.createElement("button");
    card.className = "card";
    card.type = "button";
    card.setAttribute("aria-label", "Card");
    card.dataset.emoji = emoji;

    card.innerHTML =
      '<div class="card-inner">' +
        '<div class="face face-back"><span class="star">★</span></div>' +
        '<div class="face face-front">' + emoji + '</div>' +
      '</div>';

    card.addEventListener("click", function () {
      onCardClick(card);
    });
    return card;
  }

  function onCardClick(card) {
    if (lockBoard) return;
    if (card === firstCard) return;
    if (card.classList.contains("matched")) return;
    if (card.classList.contains("flipped")) return;

    card.classList.add("flipped");

    if (!firstCard) {
      firstCard = card;
      return;
    }

    secondCard = card;
    moves++;
    movesEl.textContent = moves;
    checkMatch();
  }

  function checkMatch() {
    var isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;

    if (isMatch) {
      firstCard.classList.add("matched");
      secondCard.classList.add("matched");
      matchedCount++;
      resetTurn();
      if (matchedCount === PAIRS) {
        setTimeout(showWin, 600);
      }
    } else {
      lockBoard = true;
      setTimeout(function () {
        firstCard.classList.remove("flipped");
        secondCard.classList.remove("flipped");
        resetTurn();
      }, 900);
    }
  }

  function resetTurn() {
    firstCard = null;
    secondCard = null;
    lockBoard = false;
  }

  function showWin() {
    finalMovesEl.textContent = moves;
    overlay.classList.add("show");
  }

  function startGame() {
    overlay.classList.remove("show");
    board.innerHTML = "";
    moves = 0;
    matchedCount = 0;
    firstCard = null;
    secondCard = null;
    lockBoard = false;
    movesEl.textContent = "0";

    var deck = buildDeck();
    for (var i = 0; i < deck.length; i++) {
      board.appendChild(createCard(deck[i]));
    }
  }

  playAgainBtn.addEventListener("click", startGame);

  startGame();
</script>
</body>
</html>
